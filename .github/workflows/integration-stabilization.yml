name: OBEOS Integration Stabilization

on:
  push:
    branches: [agent/integration-stabilization-v0.9]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-matrix:
    name: Core ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: obeos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          path: obeos
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: obeos/pyproject.toml
      - name: Install OBEOS
        run: python -m pip install -U pip && python -m pip install -e .
      - name: DAISE + contracts
        run: python -m pytest -q tests/test_daise_cutover_event_v1.py tests/test_integration_stabilization.py
      - name: Existing DAISE regression suite
        run: python -m pytest -q tests/test_agent_model_and_memory_profiles.py tests/test_daise_file_chat_and_cognition.py tests/test_identity_safety_semantics.py
      - name: Thoughtglass regression suite
        run: python -m pytest -q tests/test_blackfong_cortex_thoughtglass.py
      - name: OBEOS automated verification
        run: python -m blackfong_ecosystem.cli verify automated
      - name: OBEOS surface verification
        run: python -m blackfong_ecosystem.cli verify surfaces
      - name: OBEOS integration verification
        run: python -m blackfong_ecosystem.cli verify integrations

  child-components:
    name: Public child component test matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize accessible canonical submodules
        shell: bash
        run: git submodule update --init --depth=1 Max-Payne Night-watch-OS Blackforge 3000-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MaxPayne
        working-directory: Max-Payne
        run: python -m pip install -e '.[dev,web]' && python -m pytest -q
      - name: Nightwatch
        working-directory: Night-watch-OS
        run: python -m pip install -e . pytest && python -m pytest -q
      - name: BlackForge
        working-directory: Blackforge
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: 3000
        working-directory: 3000-main
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: Private EarthGlass boundary
        run: echo 'EarthGlass is private and is validated in its own canonical repository workflow.'

  release-gate:
    name: v0.9 automated OBEOS gate
    runs-on: ubuntu-latest
    needs: [core-matrix, child-components]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Full OBEOS verification
        run: python -m blackfong_ecosystem.cli verify full
      - name: Confirm canonical public gitlinks are initialized cleanly
        shell: bash
        run: |
          git submodule update --init --depth=1 Max-Payne Night-watch-OS Blackforge 3000-main
          git submodule status Max-Payne Night-watch-OS Blackforge 3000-main
          if git submodule status Max-Payne Night-watch-OS Blackforge 3000-main | grep -E '^[+-]'; then
            echo 'Public submodule mismatch or uninitialized submodule detected'
            exit 1
          fi
      - name: External gates remain required
        run: echo 'EarthGlass canonical CI, Kubuntu/Plasma VM acceptance, cloud/Telegram and Legion runtime evidence remain separate required gates.'
