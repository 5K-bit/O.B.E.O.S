name: OBEOS Integration Stabilization

on:
  push:
    branches: [agent/integration-stabilization-v0.9]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-matrix:
    name: Core ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install OBEOS
        run: python -m pip install -U pip && python -m pip install -e .
      - name: DAISE + contracts
        run: python -m pytest -q tests/test_daise_cutover_event_v1.py tests/test_integration_stabilization.py
      - name: Existing DAISE regression suite
        run: python -m pytest -q tests/test_agent_model_and_memory_profiles.py tests/test_daise_file_chat_and_cognition.py tests/test_identity_safety_semantics.py
      - name: Thoughtglass regression suite
        run: python -m pytest -q tests/test_blackfong_cortex_thoughtglass.py
      - name: OBEOS automated verification
        run: python -m blackfong_ecosystem.cli verify automated
      - name: OBEOS surface verification
        run: python -m blackfong_ecosystem.cli verify surfaces
      - name: OBEOS integration verification
        run: python -m blackfong_ecosystem.cli verify integrations

  child-components:
    name: Child component test matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MaxPayne
        working-directory: Max-Payne
        run: python -m pip install -e '.[dev,web]' && python -m pytest -q
      - name: Nightwatch
        working-directory: Night-watch-OS
        run: python -m pip install -e . pytest && python -m pytest -q
      - name: EarthGlass
        working-directory: EarthGlass
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: BlackForge
        working-directory: Blackforge
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: 3000
        working-directory: 3000-main
        run: python -m pip install -e '.[dev]' && python -m pytest -q

  release-gate:
    name: v0.9 automated release gate
    runs-on: ubuntu-latest
    needs: [core-matrix, child-components]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Full OBEOS verification
        run: python -m blackfong_ecosystem.cli verify full
      - name: Confirm submodules initialized
        shell: bash
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-]'; then
            echo 'Submodule mismatch or uninitialized submodule detected'
            exit 1
          fi
      - name: Release remains VM-gated
        run: |
          echo 'Automated matrix passed. Kubuntu/Plasma VM acceptance is still a separate required manual gate.'
