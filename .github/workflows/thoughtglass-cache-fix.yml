name: Thoughtglass Cache Repair

on:
  push:
    branches:
      - agent/integration-stabilization-v0.9

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gesture snapshot cache
        run: python tools/patch_thoughtglass_cache.py
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add blackfong_ecosystem/operational_interfaces.py
          git commit -m "Fix Thoughtglass gesture snapshot cache"
          git push origin HEAD:agent/integration-stabilization-v0.9
