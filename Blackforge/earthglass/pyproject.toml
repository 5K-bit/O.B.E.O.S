[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthglass"
version = "0.1.0"
description = "EarthGlass: a layered geospatial dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.27.0",
]

[project.scripts]
earthglass = "earthglass.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["earthglass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
