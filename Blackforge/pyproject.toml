[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackforge"
version = "0.1.0"
description = "Local-first project scaffolding tool for clean starter templates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1.6",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[project.scripts]
blackforge = "blackforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
